<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCC Batting Stats</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background:#f4f6f8;
  font-family:Arial;
  padding:20px;
}
h2 {
  text-align:center;
  margin-bottom:20px;
}
table th, table td {
  text-align:center;
}
</style>
</head>

<body>

<h2>BCC Batting Stats</h2>

<table class="table table-striped table-bordered" id="statsTable">
  <thead class="table-dark">
    <tr>
      <th>Player Name</th>
      <th>Matches</th>
      <th>Innings</th>
      <th>Runs</th>
      <th>Balls</th>
      <th>6s</th>
      <th>4s</th>
      <th>Dots</th>
      <th>S/R</th>
      <th>Avg</th>
      <th>HS</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>
Papa.parse("bcc_data.csv", {
  download: true,
  header: true,
  complete: function(results) {

    const data = results.data;
    const players = {};

    data.forEach(row => {
      const name = row["Player Name"];
      const date = row["Date"];

      if (!name) return;

      if (!players[name]) {
        players[name] = {
          dates: new Set(),
          innings: 0,
          runs: 0,
          balls: 0,
          sixes: 0,
          fours: 0,
          dots: 0,
          outs: 0,
          hs: 0
        };
      }

      let p = players[name];

      p.dates.add(date);
      p.innings++;

      let runs = parseInt(row["Runs Scored"]) || 0;
      let balls = parseInt(row["Balls Played"]) || 0;

      p.runs += runs;
      p.balls += balls;
      p.sixes += parseInt(row["6s"]) || 0;
      p.fours += parseInt(row["4s"]) || 0;
      p.dots += parseInt(row["DOTS Played"]) || 0;

      if ((row["Not Out"] || "0") == "0") {
        p.outs++;
      }

      if (runs > p.hs) p.hs = runs;
    });

    const tbody = document.querySelector("#statsTable tbody");

    Object.keys(players).forEach(name => {
      const p = players[name];

      const matches = p.dates.size;
      const sr = p.balls ? ((p.runs / p.balls) * 100).toFixed(1) : 0;
      const avg = p.outs ? (p.runs / p.outs).toFixed(1) : p.runs;

      const row = `
        <tr>
          <td>${name}</td>
          <td>${matches}</td>
          <td>${p.innings}</td>
          <td>${p.runs}</td>
          <td>${p.balls}</td>
          <td>${p.sixes}</td>
          <td>${p.fours}</td>
          <td>${p.dots}</td>
          <td>${sr}</td>
          <td>${avg}</td>
          <td>${p.hs}</td>
        </tr>
      `;

      tbody.innerHTML += row;
    });
  }
});
</script>

</body>
</html>

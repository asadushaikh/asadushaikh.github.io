<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCC Batting Stats</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background:#f9f9f9;
  font-family:Arial, sans-serif;
  padding:15px;
}

/* Headings */
h2, h3 { text-align:center; color:#1b3a57; margin-bottom:15px; }

/* Filter */
#seasonFilter { width:200px; display:inline-block; margin-bottom:20px; }

/* Table */
table { width:100%; border-collapse:collapse; }
table th, table td { text-align:center; padding:8px; font-size:0.9rem; }
table th { background:#1b3a57; color:#fff; }
table tbody tr:nth-child(odd) { background:#eef2f7; }

/* Highlights */
.high-sr { background:#d4edda; font-weight:bold; }  /* light green */
.high-avg { background:#fff3cd; font-weight:bold; } /* light yellow */

/* Leaderboard */
#leaderboard { display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin-bottom:25px; }
.leader-card { background:#fff; padding:12px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); width:140px; text-align:center; }
.leader-card h4 { margin:0 0 5px 0; font-size:1rem; color:#1b3a57; }
.leader-card p { margin:2px 0; font-size:0.85rem; }

/* Responsive for mobile */
@media(max-width:768px){
  table th, table td {
    font-size: 0.75rem;
    padding: 4px 6px;
  }
  /* Keep leaderboard cards side by side */
  #leaderboard {
    flex-wrap: nowrap;
    overflow-x:auto;
  }
}
</style>
</head>

<body>

<h2>BCC Batting Stats</h2>

<!-- Season Filter -->
<div style="text-align:center;">
  <label><b>Filter Season:</b></label>
  <select id="seasonFilter" class="form-select">
    <option value="all">All Seasons</option>
    <option value="s1">2024-25 Season</option>
    <option value="s2">2025-26 Season</option>
  </select>
</div>

<!-- Top 5 Leaderboard -->
<div>
  <h3>🏆 Top 5 Players</h3>
  <div id="leaderboard"></div>
</div>

<!-- Stats Table -->
<table class="table table-bordered" id="statsTable">
  <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>M</th>
      <th>I</th>
      <th>R</th>
      <th>B</th>
      <th>6s</th>
      <th>4s</th>
      <th>Dots</th>
      <th>S/R</th>
      <th>Avg</th>
      <th>HS</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
let fullData = [];
const excludePlayers = [
  "Asam","Hasnain","Irfan","Khairul","Muddassir","Nafees",
  "Misbah","Waseem","Nayeem","Idrees","Deewan Waqas Jamil",
  "Deewaan Rashid (For Anas)","Sheraz (For Majid)","Misbah",
  "Rashid(For Anas)"
];

Papa.parse("bcc_data.csv", {
  download: true,
  header: true,
  complete: function(results) {
    fullData = results.data;
    renderTable("all");

    document.getElementById("seasonFilter").addEventListener("change", function() {
      renderTable(this.value);
    });
  }
});

function renderTable(season) {
  const players = {};
  const cutoffDate = new Date("2025-04-20");

  const filteredData = fullData.filter(row => {
    if (!row["Player Name"] || row["Player Name"].trim()==="") return false;
    if (row["Player Name"].includes("(G)")) return false; // remove guests
    if (excludePlayers.includes(row["Player Name"])) return false; // remove excluded
    const matchDate = new Date(row["Date"]);
    if (season === "s1") return matchDate < cutoffDate;
    if (season === "s2") return matchDate >= cutoffDate;
    return true;
  });

  filteredData.forEach(row => {
    const name = row["Player Name"];
    const date = row["Date"];
    if (!players[name]) {
      players[name] = {dates:new Set(), innings:0, runs:0, balls:0, sixes:0, fours:0, dots:0, outs:0, hs:0};
    }
    let p = players[name];
    p.dates.add(date);
    p.innings++;
    let runs = parseInt(row["Runs Scored"]) || 0;
    let balls = parseInt(row["Balls Played"]) || 0;
    p.runs += runs;
    p.balls += balls;
    p.sixes += parseInt(row["6s"]) || 0;
    p.fours += parseInt(row["4s"]) || 0;
    p.dots += parseInt(row["DOTS Played"]) || 0;
    if ((row["Not Out"] || "0") == "0") p.outs++;
    if (runs > p.hs) p.hs = runs;
  });

  // Stats calculation
  Object.keys(players).forEach(name => {
    const p = players[name];
    p.matches = p.dates.size;
    p.sr = p.balls ? ((p.runs / p.balls)*100).toFixed(1) : 0;
    p.avg = p.outs ? (p.runs / p.outs).toFixed(1) : p.runs;
  });

  // Best SR & Avg
  let bestSR=0, bestAvg=0;
  Object.values(players).forEach(p => {
    if(parseFloat(p.sr)>bestSR) bestSR=parseFloat(p.sr);
    if(parseFloat(p.avg)>bestAvg) bestAvg=parseFloat(p.avg);
  });

  // Render table sorted by runs
  const tbody = document.querySelector("#statsTable tbody");
  tbody.innerHTML="";
  Object.entries(players)
    .sort((a,b)=>b[1].runs - a[1].runs)
    .forEach(([name,p])=>{
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${name}</td>
        <td>${p.matches}</td>
        <td>${p.innings}</td>
        <td>${p.runs}</td>
        <td>${p.balls}</td>
        <td>${p.sixes}</td>
        <td>${p.fours}</td>
        <td>${p.dots}</td>
        <td class="${p.sr==bestSR?'high-sr':''}">${p.sr}</td>
        <td class="${p.avg==bestAvg?'high-avg':''}">${p.avg}</td>
        <td>${p.hs}</td>
      `;
      tbody.appendChild(row);
    });

  // Render Top 5 leaderboard
  const top5 = Object.entries(players).sort((a,b)=>b[1].runs - a[1].runs).slice(0,5);
  const leaderboard = document.getElementById("leaderboard");
  leaderboard.innerHTML="";
  top5.forEach(([name,p],index)=>{
    const div=document.createElement("div");
    div.className="leader-card";
    div.innerHTML = `
      <h4>${index+1}. ${name}</h4>
      <p><b>Runs:</b> ${p.runs}</p>
      <p><b>Avg:</b> ${p.avg}</p>
      <p><b>SR:</b> ${p.sr}</p>
    `;
    leaderboard.appendChild(div);
  });
}
</script>

</body>
</html>

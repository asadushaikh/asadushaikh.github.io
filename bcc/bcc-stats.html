<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCC Stats</title>

<style>
body{
    font-family: Arial;
    background:#f4f6f8;
    padding:20px;
}

h1{
    text-align:center;
}

/* Frame Styling */
.frame{
    background:white;
    padding:20px;
    margin:30px auto;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    max-width:1000px;
}

.frame h2{
    text-align:center;
    margin-bottom:20px;
}

/* Player Cards */
.grid{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}

.card{
    width:180px;
    text-align:center;
    background:#fafafa;
    padding:10px;
    border-radius:10px;
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
}
</style>

</head>

<body>

<h1>BCC Stats Home</h1>

<!-- CENTURIONS -->
<div class="frame">
    <h2>Centurions</h2>
    <div id="centurions" class="grid"></div>
</div>

<!-- TOP 5 -->
<div class="frame">
    <h2>Top 5 Batsmen</h2>
    <div id="top5" class="grid"></div>
</div>

<script>
fetch("data/bcc_data.csv")
.then(res => res.text())
.then(data => {

    const rows = data.split("\n").slice(1);

    let players = {};
    let centurions = [];

    rows.forEach(row => {
        const cols = row.split(",");

        if(cols.length < 8) return;

        const name = cols[0];              // Player Name
        const date = cols[3];              // Date
        const runs = parseInt(cols[6]);    // Runs Scored
        const balls = parseInt(cols[7]);   // Balls Played

        if(isNaN(runs) || isNaN(balls)) return;

        // TRACK PLAYER STATS
        if(!players[name]){
            players[name] = {
                runs:0,
                balls:0,
                innings:0
            };
        }

        players[name].runs += runs;
        players[name].balls += balls;
        players[name].innings += 1;

        // CENTURIONS (100+ in a match)
        if(runs >= 100){
            centurions.push({
                name, date, runs, balls
            });
        }
    });

    // ======================
    // RENDER CENTURIONS
    // ======================
    const centDiv = document.getElementById("centurions");
    centDiv.innerHTML = "";

    centurions.forEach(p => {
        const imgName = p.name.toLowerCase().replace(/\s+/g, "_");

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="bcc/images/${imgName}.jpg" onerror="this.src='images/default.jpg'">
            <p><b>${p.name}</b></p>
            <p>${p.date}</p>
            <p>${p.runs} (${p.balls})</p>
        `;

        centDiv.appendChild(card);
    });

    // ======================
    // TOP 5 BATSMEN
    // ======================
    let stats = Object.entries(players).map(([name, p]) => {
        return {
            name,
            runs: p.runs,
            avg: (p.runs / p.innings).toFixed(1),
            sr: ((p.runs / p.balls) * 100).toFixed(1)
        };
    });

    stats.sort((a,b) => b.runs - a.runs);
    const top5 = stats.slice(0,5);

    const topDiv = document.getElementById("top5");
    topDiv.innerHTML = "";

    top5.forEach(p => {
        const imgName = p.name.toLowerCase().replace(/\s+/g, "_");

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="images/${imgName}.jpg" onerror="this.src='images/default.jpg'">
            <p><b>${p.name}</b></p>
            <p>Runs: ${p.runs}</p>
            <p>Avg: ${p.avg}</p>
            <p>S/R: ${p.sr}</p>
        `;

        topDiv.appendChild(card);
    });

});
</script>

</body>
</html>

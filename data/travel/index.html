<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Dashboard</title>

<style>
html, body {
margin: 0;
padding: 0;
height: 100%;
width: 100%;
overflow-x: hidden;
background: #ffffff;
}

.tableauPlaceholder {
width: 100%;
height: 100vh;
}
</style>
</head>

<body>

<div class='tableauPlaceholder' id='vizTravel'>

<object class='tableauViz' style='display:none;'>
<param name='host_url' value='https://public.tableau.com/' />
<param name='embed_code_version' value='3' />
<param name='name' value=https://public.tableau.com/views/mytravelstory/Story1?:language=en-US&:sid=&:redirect=auth&:display_count=n&:origin=viz_share_link />
<param name='tabs' value='no' />
<param name='toolbar' value='yes' />
</object>

</div>

<script>
var divElement = document.getElementById('vizTravel');
var vizElement = divElement.getElementsByTagName('object')[0];

vizElement.style.width = '100%';
vizElement.style.height = window.innerHeight + 'px';

var scriptElement = document.createElement('script');
scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
vizElement.parentNode.insertBefore(scriptElement, vizElement);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>My Travel Dashboard | Asad Shaikh</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f8;
    font-family: Arial, Helvetica, sans-serif;
}

/* NAVBAR */
.navbar{
    background:#0a2342 !important;
}

/* TITLE */
.section-title{
    color:#0a2342;
    font-weight:700;
}

/* TABLEAU CONTAINER */
.tableau-container{
    display:flex;
    justify-content:center;
    margin-top:30px;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark">
<div class="container">
<a class="navbar-brand" href="../">Asad Shaikh</a>
</div>
</nav>

<!-- HEADER -->
<section class="p-4 text-center">
<div class="container">
<h2 class="section-title">My Travel Dashboard</h2>
</div>
</section>

<!-- TABLEAU DASHBOARD -->
<section class="tableau-container">

<div class='tableauPlaceholder' id='vizTravel' style='position: relative'>

<noscript>
<a href='#'>
<img alt='Travel Dashboard'
src='https://public.tableau.com/static/images/my/mytravelstory/Story1/1_rss.png'
style='border:none' />
</a>
</noscript>

<object class='tableauViz' style='display:none;'>
<param name='host_url' value='https://public.tableau.com/' />
<param name='embed_code_version' value='3' />
<param name='name' value='mytravelstory/Story1' />
<param name='tabs' value='no' />
<param name='toolbar' value='yes' />
</object>

</div>

</section>

<!-- SCRIPT -->
<script>
var divElement = document.getElementById('vizTravel');
var vizElement = divElement.getElementsByTagName('object')[0];

// ✅ Make responsive instead of fixed size
vizElement.style.width = "100%";
vizElement.style.height = "900px";

var scriptElement = document.createElement('script');
scriptElement.src = "https://public.tableau.com/javascripts/api/viz_v1.js";
vizElement.parentNode.insertBefore(scriptElement, vizElement);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BCC Home</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    text-align: center;
}

header {
    background: #0a2342;
    color: white;
    padding: 20px;
    font-size: 22px;
}

.section {
    margin: 20px;
    padding: 20px;
    background: white;
    border-radius: 10px;
}

button {
    background: #0a2342;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

.members {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
}

.member {
    width: 100px;
}

.member img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
}
</style>

</head>

<body>

<header id="welcomeText">Welcome</header>

<div class="section">
    <h3>Last Game</h3>
    <p id="lastGame">Loading...</p>

    <h3>Next Game</h3>
    <p id="nextGame">Loading...</p>
</div>

<div class="section">
    <button onclick="goToDashboard()">Go to BCC Stats Dashboard</button>
</div>

<div class="section">
    <h3>Members</h3>
    <div class="members" id="membersList"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// AUTH USER
firebase.auth().onAuthStateChanged(async (user) => {
    if (user) {

        // Get user data
        const doc = await db.collection("users").doc(user.uid).get();
        const data = doc.data();

        document.getElementById("welcomeText").innerText =
            "Welcome, " + data.name;

    } else {
        window.location.href = "/login";
    }
});

// LOAD MATCH INFO
async function loadMatches() {
    const doc = await db.collection("matches").doc("current").get();
    const data = doc.data();

    document.getElementById("lastGame").innerText = data.lastGame;
    document.getElementById("nextGame").innerText = data.nextGame;
}

loadMatches();

// LOAD MEMBERS
async function loadMembers() {
    const snapshot = await db.collection("users").get();
    const container = document.getElementById("membersList");

    snapshot.forEach(doc => {
        const user = doc.data();

        const div = document.createElement("div");
        div.className = "member";

        div.innerHTML = `
            <img src="${user.photo || 'https://via.placeholder.com/100'}" />
            <p>${user.name}</p>
        `;

        container.appendChild(div);
    });
}

loadMembers();

// NAVIGATION
function goToDashboard() {
    window.location.href = "/bcc-stats";
}
</script>

</body>
</html>
